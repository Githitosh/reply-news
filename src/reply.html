<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<script>/* The chosen color, before the page draws, so it does not flash another color. */
document.documentElement.dataset.theme = 'dark';
try { document.documentElement.dataset.theme = localStorage.getItem('replyNews.theme') || 'dark'; } catch (e) {}</script>
<title>Reply News</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700;900&family=Tinos:wght@700&display=swap" rel="stylesheet">
<style>
/* White: the page is white and the buttons, links and lit buttons are gray. */
:root { --bg:#ffffff; --card:#f1f2f4; --line:#d9dbe0; --ink:#16181c; --mute:#62666d; --acc:#6b7078; --field:#ffffff; --on:#ffffff; --frame:#f2f3f5; }
/* Colors, chosen in Settings. Dark is the default (set on the page before it draws). */
:root[data-theme="beige"] { --bg:#f7f1e6; --card:#fffaf2; --line:#e4d8c4; --ink:#1c140c; --mute:#6d6458; --acc:#9a5b12; --field:#ffffff; --on:#fffaf2; --frame:#f4efe4; }
:root[data-theme="pink"] { --bg:#fff6f9; --card:#ffffff; --line:#f2d4df; --ink:#2b1620; --mute:#7c5e6a; --acc:#d6457a; --field:#ffffff; --on:#ffffff; --frame:#fdeef3; }
:root[data-theme="sky"] { --bg:#f3f8fd; --card:#ffffff; --line:#d3e2f2; --ink:#10202f; --mute:#58697a; --acc:#2a7bc8; --field:#ffffff; --on:#ffffff; --frame:#eaf2fa; }
:root[data-theme="mint"] { --bg:#f2fbf7; --card:#ffffff; --line:#cfe9dd; --ink:#11231b; --mute:#56706a; --acc:#1f9a6a; --field:#ffffff; --on:#ffffff; --frame:#e6f5ee; }
:root[data-theme="dark"] { --bg:#111214; --card:#1b1c1f; --line:#2d2f34; --ink:#f1f2f4; --mute:#9ea3ab; --acc:#f0c36b; --field:#15161a; --on:#151515; --frame:#1b1c1f; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Noto Sans JP","Hiragino Sans",system-ui,sans-serif; overscroll-behavior-y: none; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 8px; position: sticky; top: 0; z-index: 40; background: var(--bg); touch-action: none; }
button.title { background: none; border: 0; padding: 0; color: var(--ink); font: 700 20px/1.2 "Noto Serif JP",serif; cursor: pointer; }
header .pull { display: block; color: var(--mute); font-size: 12px; letter-spacing: .04em; }
a.jump { color: var(--acc); font: 700 14px/1 "Noto Sans JP",sans-serif; text-decoration: none; }
.hright { display: flex; align-items: center; gap: 12px; }
#gear { width: 48px; height: 44px; padding: 0; font-size: 22px; line-height: 1; touch-action: manipulation; }
#gear.on { background: var(--acc); border-color: var(--acc); color: var(--on); }
main { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
/* The portrait video is as tall as the screen allows, leaving room for the title and the buttons. */
.frame { width: min(100%, max(280px, calc((100vh - 150px) * 9 / 16))); width: min(100%, max(280px, calc((100dvh - 150px) * 9 / 16))); }
.ctl, .seekrow, .caption, .music, .music-label, .ask { max-width: 560px; margin-left: auto; margin-right: auto; }
/* The box under the video: what is typed joins the genres, and the video is made again. */
.ask { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
.ask input[type=text] { flex: 1 1 auto; width: auto; min-width: 0; font-size: 16px; padding: 10px 12px; }
.ask button { flex: none; padding: 10px 12px; font-size: 14px; white-space: nowrap; }
.ask #askGo { background: var(--acc); border-color: var(--acc); color: var(--on); }
/* Genres on the main screen: the fixed ones, then what was typed (lit; a press removes it). */
#genreChips { justify-content: center; }
#genreChips button.mine { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
/* Settings: the rows of buttons that were under the video. */
.studio .music { margin-top: 2px; }
.terms-foot { text-align: center; font-size: 13px; margin: 56px 0 0; padding: 18px 0 8px; border-top: 1px solid var(--line); }
.terms-foot a, a.terms { color: var(--mute); }
.frame { position: relative; max-width: 100%; margin: 0 auto; transition: transform .18s ease; }
.frame.pulling { transition: none; }
/* PC layout: landscape, as wide as the page and the screen height allow. */
.land .frame { width: min(100%, max(320px, calc((100vh - 150px) * 16 / 9))); width: min(100%, max(320px, calc((100dvh - 150px) * 16 / 9))); }
.land canvas#cv { aspect-ratio: 16 / 9; }
canvas#cv { position: relative; z-index: 1; display: block; width: 100%; aspect-ratio: 9 / 16; height: auto; background: var(--frame); border-radius: 12px; }
/* iPhone: a copy of the picture as a video, behind the canvas, for the system full-screen player. */
/* A tap or click on the picture pauses and plays. */
canvas#cv { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
video#fsv { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; border-radius: 12px; background: var(--frame); }
/* Full screen: the class is set for the browser's full screen and for the page's own full screen. */
.watch.is-full { background: var(--bg); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); box-sizing: border-box; }
.watch.is-full .frame { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; width: 100%; }
.watch.is-full canvas#cv { width: 100%; height: 100%; object-fit: contain; aspect-ratio: auto; border-radius: 0; }
.watch.is-full .ctl { flex: none; width: 100%; max-width: 640px; }
.watch.is-full .ctl #update { background: var(--acc); border-color: var(--acc); color: var(--on); }
.watch.is-full .seekrow { flex: none; width: 100%; max-width: 640px; }
.watch.is-full .linkbox { flex: none; }
.watch.is-full .source-url { flex: none; }
.watch.pseudo { position: fixed; top: 0; left: 0; z-index: 100; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
body.lock { overflow: hidden; }
/* The post's link: always shown, large and easy to tap. */
.source-url { display: block; width: fit-content; max-width: 100%; margin: 6px auto 0; padding: 8px 10px; color: var(--acc); font-size: 26px; line-height: 1.3; text-align: center; word-break: break-all; text-decoration: underline; text-underline-offset: 4px; border-radius: 8px; touch-action: manipulation; }
.source-url:active { background: var(--card); }
.ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
.ctl button { white-space: nowrap; padding: 10px 11px; font-size: 14px; }
/* Sound: lit while the music plays, outlined while the video plays without it. */
button#sound.ask { border-color: var(--acc); color: var(--acc); }
button#sound.on { background: var(--acc); border-color: var(--acc); color: var(--on); }
/* On a narrow phone the seek bar and time move to a second row instead of running off the screen. */
.ctl input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--acc); }
/* The seek bar has its own row, so buttons whose words change (Play / Pause) never move it. */
.seekrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.seekrow input[type=range] { flex: 1 1 auto; min-width: 0; margin: 0; accent-color: var(--acc); }
.seekrow span { flex: none; color: var(--mute); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; font-size: 13px; }
/* Play/Pause and Update/Creating keep one width, so the buttons stay on one row and in place. */
#play, #update { min-width: 5.4em; }
#dl { width: 7.4em; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 480px) { .ctl { gap: 6px; } .ctl button { padding: 9px 8px; font-size: 13px; } }
/* The link keeps the same height for every story, so nothing below it moves. */
.linkbox { height: calc(2 * 1.3 * 26px + 22px); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.linkbox .source-url { margin: 0 auto; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
@media (min-width: 820px) { .linkbox { height: calc(1.3 * 26px + 22px); } .linkbox .source-url { -webkit-line-clamp: 1; } }
button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 15px "Noto Sans JP",sans-serif; padding: 11px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
button:disabled { opacity: .45; cursor: default; }
.music button.on, .row button.on, #genreChips button.on, #xAccounts button { background: var(--acc); border-color: var(--acc); color: var(--on); }
.caption { text-align: center; color: var(--mute); font-size: 13px; margin-top: 10px; margin-bottom: 0; }
.caption.err { color: #9a3b28; }
#sprog i { display: block; height: 100%; width: 0; background: var(--acc); }
.music-label { text-align: center; color: var(--mute); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-top: 14px; margin-bottom: 4px; }
.music { display: flex; flex-wrap: wrap; gap: 6px; }
.music button { flex: 1 1 28%; padding: 8px 6px; font-size: 13px; }
/* Settings: the same panel as the News page. */
.studio { display: grid; gap: 12px; margin-top: 16px; }
.studio:not([hidden]) { position: fixed; z-index: 35; left: 0; right: 0; bottom: 0; top: var(--header-h, 64px); margin: 0; padding: 8px 16px calc(92px + env(safe-area-inset-bottom)); overflow: auto; background: var(--bg); }
.studio > * { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
.studio-bar { position: sticky; top: -8px; z-index: 2; padding: 12px 0 8px; margin-top: -8px; background: var(--bg); }
#backVideo, #lineupGo, #applyLine { width: 100%; }
.back-dock { position: fixed; z-index: 60; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); width: auto; background: var(--acc); color: var(--on); border-color: var(--acc); font-size: 17px; padding: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
#status { min-height: 1.6em; color: var(--ink); font-size: 14px; margin-top: 10px; white-space: pre-wrap; }
#status.err { color: #9a3b28; }
#sprog { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
details[open] { padding-bottom: 12px; }
summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
label { display: block; color: var(--mute); font-size: 13px; margin: 8px 0 4px; }
input[type=text], input[type=date], select, textarea { width: 100%; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 15px "Noto Sans JP",sans-serif; }
textarea { min-height: 260px; font: 12px/1.5 ui-monospace,Menlo,monospace; }
#lineup { min-height: 180px; }
#lineup.live { border-color: var(--acc); }
.check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; margin-top: 10px; }
.check input { width: 18px; height: 18px; accent-color: var(--acc); }
.filter-row:has(input:checked), .check:has(input:checked) { color: var(--acc); }
.note { color: var(--mute); font-size: 12px; margin: 6px 0 0; }
.filters { display: grid; gap: 6px; margin: 4px 0 8px; }
.source-group { color: var(--mute); font-size: 12px; margin: 14px 0 0; }
.x-add { display: flex; gap: 8px; align-items: center; }
.x-add input { flex: 1 1 auto; width: auto; }
.x-add button { flex: 0 0 auto; }
#xAccounts { margin-top: 8px; }
#xAccounts button, #genreChips button { flex: 0 1 auto; }
.filter-row { display: flex; align-items: center; gap: 8px; }
.filter-row .check { margin: 0; flex: 1; }
.filter-row select { width: 7.2em; }
button.primary { background: var(--acc); color: var(--on); border-color: var(--acc); width: 100%; font-size: 17px; padding: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.hides { margin-top: 12px; }
.hides button { flex: 1 1 40%; }
pre#sources { white-space: pre-wrap; font: 12px/1.5 ui-monospace,Menlo,monospace; color: var(--ink); margin: 0 0 8px; }
#out { display: none; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
#out.show { display: flex; }
#out .btn { flex: 1 1 30%; font-size: 14px; }
.set-title { margin: 0; font: 700 18px "Noto Serif JP",serif; color: var(--ink); }
.site-link a { color: var(--acc); word-break: break-all; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><div><button type="button" id="home" class="title">Reply News</button></div><div class="hright"><button type="button" id="gear" aria-label="Settings" aria-expanded="false">*</button></div></header>
<button type="button" id="backDock" class="back-dock" hidden>Back to video</button>
<main>
  <div id="watch" class="watch">
    <div class="frame">
      <canvas id="cv" width="1080" height="1920"></canvas>
    </div>
    <div class="linkbox"><a id="storyLink" class="source-url" href="" target="_blank" rel="noopener" hidden></a></div>
    <div class="ctl">
      <button id="play" disabled>Play</button>
      <button id="sound" type="button" aria-pressed="false">Sound</button>
      <button id="full" type="button">Full screen</button>
      <button id="update" type="button">Update</button>
      <button id="dl" type="button" disabled>Download</button>
    </div>
    <div class="seekrow">
      <input type="range" id="seek" min="0" max="1000" value="0" disabled>
      <span id="time">0.0 / 0.0</span>
    </div>
  </div>
  <form id="ask" class="ask" autocomplete="off">
    <input type="text" id="askText" enterkeyhint="go" placeholder="Words, @account or post URL">
  </form>
  <p id="caption" class="caption">Opening Reply News…</p>
  <p class="music-label">Genres</p>
  <div id="genreChips" class="music"></div>
  <p class="terms-foot"><a class="terms" href="terms.html" target="_blank" rel="noopener">Terms of use</a></p>

  <div id="studio" class="studio" hidden>
    <div class="studio-bar"><button type="button" id="backVideo">Back to video</button></div>
    <section class="card" id="setBox">
      <p class="set-title">Reply News settings</p>
      <label for="layout">Layout</label>
      <select id="layout">
        <option value="auto">Auto</option>
        <option value="phone">Phone</option>
        <option value="x">X</option>
        <option value="youtube">YouTube</option>
        <option value="pc">PC</option>
      </select>
      <label for="theme">Color</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="white">White</option>
        <option value="beige">Beige</option>
        <option value="pink">Pink</option>
        <option value="sky">Sky blue</option>
        <option value="mint">Mint</option>
      </select>
      <label>Items</label>
      <div class="music" id="counts"></div>
      <label>Story length</label>
      <div class="music" id="paces"></div>
      <label>Wallpaper</label>
      <div class="music" id="walls"></div>
      <label>Music</label>
      <div class="music" id="music"></div>
      <label for="country">Country</label>
      <select id="country"></select>
      <label for="lang">Language</label>
      <select id="lang"></select>
      <label for="endMode">At the end</label>
      <select id="endMode">
        <option value="update">Update</option>
        <option value="loop">Repeat</option>
      </select>
      <label for="speed">Update speed</label>
      <select id="speed">
        <option value="normal">Normal</option>
        <option value="fast">Fast</option>
      </select>
      <label for="feed">Feed</label>
      <select id="feed">
        <option value="x">X comments only</option>
        <option value="news">News, then comments</option>
      </select>
      <div hidden>
      <label for="lineup">Lineup</label>
      <button type="button" id="lineupGo">Lineup</button>
      <textarea id="lineup" rows="8" spellcheck="false" placeholder="Shibuya&#10;2002 World Cup final&#10;Romance&#10;Jokes"></textarea>
      <button id="applyLine" type="button">Apply lineup</button>
      </div>
      <div class="music hides">
        <button type="button" id="hideSensitive" aria-pressed="false">Hide sensitive posts</button>
      </div>
      <label>Sources</label>
      <div id="sourceFilters" class="filters"></div>
      <label for="mediaIn">Media</label>
      <div class="x-add">
        <input id="mediaIn" type="text" inputmode="url" spellcheck="false" placeholder="https://www.example.co.jp/">
        <button type="button" id="addMedia">Add</button>
      </div>
      <div id="mediaList" class="music"></div>
      <label for="xUser">X accounts</label>
      <div class="x-add">
        <input id="xUser" type="text" autocomplete="username" spellcheck="false" placeholder="@name">
        <button type="button" id="addX">Add</button>
      </div>
      <div id="xAccounts" class="music"></div>
      <label for="date">Date</label>
      <input type="date" id="date">
      <label class="check"><input type="checkbox" id="autoExport"> Export MP4 files after the stories are ready</label>
      <div hidden>
      <label>Formats to export</label>
      <label class="check"><input type="checkbox" class="fx" value="x" checked> Phone and X (portrait 1080×1920)</label>
      <label class="check"><input type="checkbox" class="fx" value="youtube" checked> YouTube (portrait 1080×1920, room for buttons)</label>
      <label class="check"><input type="checkbox" class="fx" value="pc" checked> PC (landscape 1920×1080)</label>
      <button id="go" class="primary">Collect and play</button>
      </div>
      <div id="status">Opening Reply News…</div>
      <div id="sprog"><i></i></div>
      <div id="out" class="row"></div>
      <p class="note site-link">Public page: <a href="https://githitosh.github.io/reply-news/" target="_blank" rel="noopener">https://githitosh.github.io/reply-news/</a></p>
    </section>

    <details hidden>
      <summary>Script (JSON)</summary>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="apply">Apply script</button>
        <button id="exportBtn" disabled>Export MP4</button>
      </div>
    </details>

    <details hidden>
      <summary>Sources</summary>
      <pre id="sources"></pre>
      <button id="copySrc">Copy sources</button>
    </details>
  </div>
</main>

<script>
(() => {
'use strict';
const ASSETS = /*__ASSETS__*/;
const E = window.NSEngine;
const $ = id => document.getElementById(id);
const ctx = $('cv').getContext('2d');
const Q = new URLSearchParams(location.search);
const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const WATCH = Q.get('watch') !== '0' && !REDUCE;
const store = {
  get(k, d) { try { const v = localStorage.getItem('replyNews.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('replyNews.' + k, v); } catch (e) {} },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad2 = n => String(n).padStart(2, '0');
/* Items: how many cards one video plays. Chosen under the video. */
const COUNTS = [5, 10, 20];
const MAX_ITEMS = 24;
/* Every card in a video gets the same headline size, and the Japanese lines below it are twice the usual size. */
/* lang: the date line at the top is in the chosen language only. */
const LOOK = { uniform: true, jp: 2, brand: { ja: 'リプライニュース', en: 'Reply News' }, get lang() { const el = document.getElementById('lang'); return el && el.value === 'en' ? 'en' : 'ja'; } };

/* ---------- the same choices as the News page ---------- */
const FORMATS = { x: 'Phone', youtube: 'YouTube', pc: 'PC' };
/* PC uses the wide single-column layout, which keeps the large Japanese text whole. */
const PRESET = { x: 'x', youtube: 'youtube', pc: 'wide' };
const COUNTRIES = [
  { id: 'JP', name: 'Japan', lang: 'ja' },
  { id: 'US', name: 'United States', lang: 'en' },
];
const LANGS = [
  { id: 'en', name: 'English' },
  { id: 'ja', name: 'Japanese' },
];
const WALLS = [
  { id: 'morning', name: 'Morning' },
  { id: 'bright', name: 'Bright' },
  { id: 'day', name: 'Day' },
  { id: 'evening', name: 'Evening' },
  { id: 'night', name: 'Night' },
  { id: 'pop', name: 'Pop' },
];
function total() {
  const n = Number(store.get('count', '10'));
  return COUNTS.includes(n) ? n : 10;
}
/* Split n over k lines: as even as possible, the first lines get the extra ones. */
function shares(n, k) {
  return Array.from({ length: k }, (_, i) => Math.floor(n / k) + (i < n % k ? 1 : 0));
}
/* Lineup lines are names only; an old count after the name is dropped. */
function noCount(line) {
  const t = String(line || '').trim();
  if (/:\/\/|(?:x|twitter)\.com\//i.test(t)) return t;
  return t.replace(/^\s*\d+\s*[\.\)、]\s*/, '').replace(/\s*[,、]\s*\d{1,2}\s*(?:個|件|本)?\s*$|\s+\d{1,2}\s*(?:個|件|本)\s*$/, '').trim();
}
const PACES = [
  { sec: 3.2, name: '3.2s' },
  { sec: 4.2, name: '4.2s' },
  { sec: 5.2, name: '5.2s' },
];
/* Jupiter is inside the page. The others load from assets/ the first time they are chosen. */
const TRACKS = [
  { id: 'jupiter', name: 'Jupiter', file: '', credit: 'Music: Holst ‘Jupiter’ – Holst / London Symphony Orchestra (Columbia, 1922–23), Wikimedia Commons' },
  { id: 'neptune', name: 'Neptune', file: 'neptune_1923.m4a', credit: 'Music: Holst ‘Neptune’ – Holst / London Symphony Orchestra (Columbia, 1923), Wikimedia Commons' },

const USED_Q = new Map();
function variantsFor(base, extra, lang, k, tag) {
  base = String(base || '').trim();
  const key = (tag || '') + ':' + lang + ':' + base.toLowerCase();
  const own = (extra || []).filter(w => w && !base.toLowerCase().includes(String(w).toLowerCase()));
  const all = [...new Set([''].concat(own, FACETS[lang] || FACETS.en))];
  let used = USED_Q.get(key) || [];
  let fresh = all.filter(f => !used.includes(f));
  if (fresh.length < k) { used = used.slice(-1); fresh = all.filter(f => !used.includes(f)); }
  /* Words that belong to the topic (from Wikipedia) and everyday words take turns. */
  const topical = shuffle(fresh.filter(f => own.includes(f)));
  const rest = shuffle(fresh.filter(f => !own.includes(f)));
  const out = [];
  while (out.length < k && (topical.length || rest.length)) {
    if (topical.length) out.push(topical.shift());
    if (out.length < k && rest.length) out.push(rest.shift());
  }
  /* Every word gets its turn before one comes back. */
  USED_Q.set(key, used.concat(out).slice(-Math.max(k, all.length - k)));

}

  if (!pool.length) pool = list.filter(w => w !== used[used.length - 1]);
  if (!pool.length) pool = list;
  const w = pick(pool);
  USED_W.set(key, used.concat(w).slice(-Math.max(1, list.length - 1)));
  return w;
}

function rotate(list, key, k) {
  const used = USED_W.get(key) || [];
  const fresh = shuffle(list.filter(q => !used.includes(q)));
  const out = fresh.slice(0, k);

  USED_W.set(key, out);
  return out;
}

  return '';
}
function stop() {

  if (S.el) { try { S.el.pause(); } catch (e) {} }
  S.audioOn = false;

}
function endMode() { const el = $('endMode'); return el && el.value === 'loop' ? 'loop' : 'update'; }
function tick() {

  if (S.show.duration > 0 && T >= S.show.duration) {
    /* At the end: a new video (Update, the default) or the same one again (Repeat).
       If nothing new is found, the video plays again and the next end tries again (at most every 30 s). */
    if (!S.busy && endMode() === 'update' && Date.now() - (S.endTry || 0) > 30000) { S.endTry = Date.now(); refreshMarket(); }
    if (S.busy) {
      draw(Math.max(0, S.show.duration - 1 / E.FPS));
      $('seek').value = '1000';
      if (S.playing) S.raf = requestAnimationFrame(tick);
      return;
    }
    const over = T % S.show.duration;
    S.origin = over;
    S.t0perf = performance.now();
    if (S.audioOn && S.el) { try { S.el.currentTime = soundAt(over); } catch (e) {} }
    T = over;

  draw(Math.min(Math.max(0, T), Math.max(0, S.show.duration - 1 / E.FPS)));
  $('seek').value = String(Math.round(Math.min(Math.max(0, T), S.show.duration) / S.show.duration * 1000));
  if (S.playing) S.raf = requestAnimationFrame(tick);
}
async function setScript(raw, autoplay) {
  stop();
  const s = normalize(raw);
  S.script = s;
  S.show = E.prepare(s, preset(), LOOK);
  sizeCanvas();
  $('json').value = JSON.stringify(s, null, 2);
  S.jsonClean = $('json').value;
  $('sources').textContent = sourcesText(s);
  $('play').disabled = false;
  $('seek').disabled = false;
  $('exportBtn').disabled = false;
  /* An MP4 that waits to be saved stays ready; one whose save was already tried makes room for the new video. */
  if (S.ready && S.ready.tried) S.ready = null;
  resetDownload();
  $('seek').value = '0';
  draw(0);
  if (autoplay && WATCH) {
    /* Start the new video at once. The fonts finish loading while it plays. */
    beginPlayback(0);
    say(watchLine());
    playSound(0);
  } else say('Ready. Press Play.');
  await loadFonts(s);
  if (S.script !== s || !S.show) return;
  const T = S.playing ? Math.max(0, Math.min(currentT(), S.show.duration)) : 0;
  S.show = E.prepare(s, preset(), LOOK);
  sizeCanvas();
  draw(S.playing ? Math.min(T, Math.max(0, S.show.duration - 1 / E.FPS)) : 0);
}
function setBusy(b) {
  S.busy = b;
  $('update').disabled = !!b;
  $('update').textContent = b ? 'Creating…' : 'Update';
  ['go', 'apply', 'exportBtn', 'dl'].forEach(id => { $(id).disabled = !!b || ((id === 'exportBtn' || id === 'dl') && !S.show); });
  if (S.ready) $('dl').disabled = false;
}
async function runAll(opts) {
  opts = opts || {};
  if (S.busy) { S.again = opts; return; }
  setBusy(true);
  say('Searching ' + (feedMode() === 'x' ? 'X' : 'the news'));
  progress(0.05);
  let script = null;
  try {
    script = await collect();
  } catch (e) {
    console.error(e);
    if (!S.again) { say(e.message || String(e), true); progress(0); }
  }
  const again = S.again;
  S.again = null;
  setBusy(false);
  /* A newer request came in while collecting: collect again instead of showing the older result. */
  if (again) return runAll(again);
  if (!script) return;
  if (script.empty) {
    progress(0);
    say(S.show ? 'No new stories or jokes yet. This video keeps playing. Press Update again later.' : 'No new stories or jokes yet. Press Update again later.', !S.show);
    return;
  }
  try {
    progress(1);
    await setScript(script, true);
    remember(SEEN_NEWS, script.played.news, 600);
    remember(SEEN_JOKES, script.played.jokes, 600);
    if (opts.export) await exportMP4(chosenFormats());
  } catch (e) {
    console.error(e);
    say(e.message || String(e), true);
    progress(0);
  }
}
let refreshTimer = 0;
function refreshMarket() { clearTimeout(refreshTimer); refreshTimer = 0; return runAll({ export: false }).catch(() => {}); }
function scheduleRefresh(delay) {
  clearTimeout(refreshTimer);
  if (!delay) { refreshMarket(); return; }
  refreshTimer = setTimeout(refreshMarket, delay);
}
function toggle() {
  if (!S.show) return;
  if (S.playing) { stop(); draw(currentT()); say('Paused. Tap the video or press Play to continue.'); return; }
  let T0 = (+$('seek').value / 1000) * S.show.duration;
  if (T0 >= S.show.duration - 0.05) T0 = 0;
  beginPlayback(T0);
  playSound(T0);
  say('');
}

/* ---------- layout, story length, wallpaper, music ---------- */
function detectView() {
  const ua = navigator.userAgent || '';
  const ref = document.referrer || '';
  const forced = Q.get('format');
  if (FORMATS[forced]) return { format: forced, label: FORMATS[forced] };
  const phoneSized = /iPhone|iPod|Android.+Mobile|Windows Phone|IEMobile/i.test(ua)
    || !!(navigator.userAgentData && navigator.userAgentData.mobile)
    || window.innerWidth < 900;
  if (/youtube|youtu\.be/i.test(ua) || (/youtube|youtu\.be/i.test(ref) && phoneSized)) return { format: 'youtube', label: 'YouTube' };
  if (/\bTwitter\b/.test(ua) || (/twitter\.com|(?:^|\/\/)(?:www\.)?x\.com/i.test(ref) && phoneSized)) return { format: 'x', label: 'X' };
  if (phoneSized) return { format: 'x', label: 'Phone' };
  return { format: 'pc', label: 'PC' };
}
/* Rebuild the picture for a new layout or story length, keeping the place in the video. */
function reshow() {
  if (!S.script || !S.show) return;
  const frac = S.show.duration ? Math.max(0, Math.min(0.999, currentT() / S.show.duration)) : 0;
  S.show = E.prepare(S.script, preset(), LOOK);
  sizeCanvas();
  const T = frac * S.show.duration;
  if (S.playing) {
    S.origin = T;
    S.t0perf = performance.now();
    if (S.audioOn && S.el) { try { S.el.currentTime = soundAt(T); } catch (e) {} }
  }
  $('seek').value = String(Math.round(frac * 1000));
  draw(Math.min(T, Math.max(0, S.show.duration - 1 / E.FPS)));
}
function applyLayout() {
  const box = $('layout');
  const detected = detectView();
  const opt = box.querySelector('option[value="auto"]');
  if (opt) opt.textContent = 'Auto (' + detected.label + ')';
  const choice = box.value;
  let format = detected.format;
  if (choice === 'phone' || choice === 'x') format = 'x';
  else if (choice === 'youtube' || choice === 'pc') format = choice;
  S.format = format;
  document.body.classList.toggle('land', format === 'pc');
  reshow();
}
function redraw() { if (S.show && !S.playing) draw(currentT()); }
function usePace(sec) {
  const next = E.setDuration(sec);
  store.set('pace', String(next));
  document.querySelectorAll('#paces button').forEach(b => b.classList.toggle('on', Number(b.dataset.p) === next));
  reshow();
}
function useWall(id) {
  const w = WALLS.find(x => x.id === id) || WALLS[2];
  E.setWallpaper(w.id);
  store.set('wall', w.id);
  document.querySelectorAll('#walls button').forEach(b => b.classList.toggle('on', b.dataset.w === w.id));

async function trackBytes(t) {
  if (S.tracks[t.id]) return S.tracks[t.id];
  const res = await fetch('assets/' + t.file);
  if (!res.ok) throw new Error('Could not load ' + t.name);
  const bytes = new Uint8Array(await res.arrayBuffer());
  S.tracks[t.id] = bytes;
  return bytes;
}
async function useTrack(id) {
  const t = TRACKS.find(x => x.id === id) || TRACKS[0];
  store.set('music', t.id);
  S.wantTrack = t.id;
  document.querySelectorAll('#music button').forEach(b => b.classList.toggle('on', b.dataset.m === t.id));
  let bytes;
  try { bytes = await trackBytes(t); } catch (e) {
    console.warn(e);
    if (S.wantTrack !== t.id) return;
    say('Could not load ' + t.name + '. Jupiter plays instead.', true);
    if (t.id !== 'jupiter') useTrack('jupiter');
    return;
  }
  if (S.wantTrack !== t.id) return;
  S.track = t;
  S.music = bytes;
  E.setMusicCredit(t.credit);
  if (S.script) $('sources').textContent = sourcesText(S.script);
  redraw();
  if (!S.el) return;
  /* The same audio element keeps playing, so iPhone still allows it after the change. */
  const was = S.audioOn;
  try { S.el.pause(); } catch (e) {}
  if (S.musicUrl) { try { URL.revokeObjectURL(S.musicUrl); } catch (e) {} }
  S.musicUrl = URL.createObjectURL(new Blob([bytes], { type: 'audio/mp4' }));
  S.el.src = S.musicUrl;
  try { S.el.load(); } catch (e) {}
  S.audioOn = false;
  paintSound();
  if (was && S.playing && !S.mute) {
    await new Promise(r => { S.el.addEventListener('loadedmetadata', r, { once: true }); setTimeout(r, 3000); });
    if (S.wantTrack === t.id && S.playing && !S.mute) playSound(currentT());
  }
}

/* ---------- MP4 export (as on the News page) ---------- */
function chosenFormats() { return [...document.querySelectorAll('.fx')].filter(x => x.checked).map(x => x.value); }
function parseM4A(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

    while (p + 8 <= b) {

      if (size === 1) { size = Number(dv.getBigUint64(p + 8)); hdr = 16; } else if (size === 0) size = b - p;
      if (size < 8) break;
      out.push({ type, data: p + hdr, end: p + size }); p += size;

  const moov = find(boxes(0, u8.length), 'moov');
  for (const trak of boxes(moov.data, moov.end).filter(x => x.type === 'trak')) {
    const mdia = find(boxes(trak.data, trak.end), 'mdia'); const mb = boxes(mdia.data, mdia.end);
    if (str(find(mb, 'hdlr').data + 8, 4) !== 'soun') continue;

    const entry = find(sb, 'stsd').data + 8;
    const channels = dv.getUint16(entry + 24), rate = dv.getUint32(entry + 32) >>> 16;
    const esds = find(boxes(entry + 36, entry + dv.getUint32(entry)), 'esds');

      const tag = u8[p++]; const n = len();
      if (tag === 3) { const fl = u8[p + 2]; p += 3; if (fl & 0x80) p += 2; if (fl & 0x40) p += 1 + u8[p]; if (fl & 0x20) p += 2; }

    const stts = find(sb, 'stts'), stsz = find(sb, 'stsz'), stsc = find(sb, 'stsc'), stco = find(sb, 'stco') || find(sb, 'co64');

    for (let i = 0; i < nch; i++) offs.push(big ? Number(dv.getBigUint64(stco.data + 8 + i * 8)) : dv.getUint32(stco.data + 8 + i * 4));
    const sc = []; for (let i = 0, n = dv.getUint32(stsc.data + 4); i < n; i++) sc.push([dv.getUint32(stsc.data + 8 + i * 12), dv.getUint32(stsc.data + 12 + i * 12)]);

      let per = 0; for (const [first, spc] of sc) if (c + 1 >= first) per = spc;
      let o = offs[c];
      for (let k = 0; k < per && s < count; k++, s++) { samples.push({ o, n: sizes[s], t: t / ts, d: (durs[s] || 1024) / ts }); o += sizes[s]; t += durs[s] || 1024; }

function fileName(date, fmt) {
  const d = new Date(), h = d.getHours();
  const stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}${h < 12 ? 'am' : 'pm'}${pad2(h)}${pad2(d.getMinutes())}`;
  return `${stamp}_ReplyNews_${FORMATS[fmt] || fmt}_${date}.mp4`;
}
async function encodeShow(show, label, p0, p1, aac) {
  const W = show.W, H = show.H, fps = E.FPS, dur = show.duration, N = Math.round(dur * fps);
  const vcfg = { codec: 'avc1.640028', width: W, height: H, bitrate: 8_000_000, framerate: fps, avc: { format: 'avc' } };
  let ok = typeof VideoEncoder !== 'undefined' && typeof VideoFrame !== 'undefined' && window.Mp4Muxer;
  if (ok) { try { ok = (await VideoEncoder.isConfigSupported(vcfg)).supported; } catch (e) { ok = false; } }
  if (!ok) return null;
  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: 'avc', width: W, height: H, frameRate: fps },
    audio: aac ? { codec: 'aac', numberOfChannels: aac.channels, sampleRate: aac.rate } : undefined,
    fastStart: 'in-memory', firstTimestampBehavior: 'offset',
  });
  let fail = null;
  const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { fail = e; } });
  enc.configure(vcfg);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c2 = cv.getContext('2d');
  for (let f = 0; f < N; f++) {
    if (fail) throw fail;
    E.drawFrame(c2, show, f / fps, S.bgs);
    const vf = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / fps), duration: Math.round(1e6 / fps) });
    enc.encode(vf, { keyFrame: f % (fps * 2) === 0 });
    vf.close();
    while (enc.encodeQueueSize > 6) await sleep(4);
    if (f % 15 === 0) { progress(p0 + (p1 - p0) * f / N); say(`Exporting ${label}… ${Math.round(f / N * 100)}%`); await sleep(0); }
  }
  await enc.flush(); enc.close();
  if (fail) throw fail;
  if (aac) {
    /* The music loops on the page, so it loops in the file too. */
    let first = true;
    for (let loop = 0, base = Math.max(0, aac.duration - dur); ; loop++) {
      const start = loop === 0 ? base : 0;
      const at0 = loop === 0 ? 0 : (aac.duration - base) + (loop - 1) * aac.duration;
      if (at0 >= dur) break;
      for (const s of aac.samples) {
        if (s.t < start - 1e-6) continue;
        const at = at0 + (s.t - start);
        if (at >= dur) break;
        muxer.addAudioChunkRaw(aac.bytes.subarray(s.o, s.o + s.n), 'key', Math.round(at * 1e6), Math.round(s.d * 1e6),
          first ? { decoderConfig: { codec: 'mp4a.40.2', numberOfChannels: aac.channels, sampleRate: aac.rate, description: aac.asc } } : undefined);
        first = false;
      }
      if (aac.duration <= 0) break;
    }
  }
  muxer.finalize();
  return new Blob([muxer.target.buffer], { type: 'video/mp4' });
}
/* Browsers without WebCodecs record the picture while it plays. */
async function recordRealtime(show) {
  if (typeof MediaRecorder === 'undefined' || !$('cv').captureStream) throw new Error('This browser cannot export video.');
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  let abuf = null;
  if (!S.mute) { try { abuf = await ac.decodeAudioData(S.music.slice().buffer); } catch (e) { console.warn(e); } }
  const dest = ac.createMediaStreamDestination();
  const vs = $('cv').captureStream(E.FPS);
  const stream = new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const type = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8_000_000 });
  const parts = []; rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(r => { rec.onstop = r; });
  let src = null;
  if (abuf) { src = ac.createBufferSource(); src.buffer = abuf; src.loop = true; src.connect(dest); }
  S.show = show; sizeCanvas(); draw(0);
  rec.start(250);
  const t0 = ac.currentTime + 0.05;
  if (src) src.start(t0, Math.max(0, abuf.duration - show.duration));
  await new Promise(res => {
    const step = () => {
      const T = ac.currentTime - t0;
      if (T >= show.duration) { res(); return; }
      draw(Math.max(0, T)); progress(0.3 + 0.65 * T / show.duration); say(`Recording… ${Math.round(T / show.duration * 100)}%`);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  rec.stop(); if (src) { try { src.stop(); } catch (e) {} }
  await done;
  try { ac.close(); } catch (e) {}
  return new Blob(parts, { type: type.split(';')[0] || 'video/webm' });
}
function addOut(fmt, blob) {
  const name = fileName(S.script.date, fmt).replace(/\.mp4$/, blob.type.includes('webm') ? '.webm' : '.mp4');
  const url = URL.createObjectURL(blob);
  S.outs = S.outs.filter(o => o.fmt !== fmt); S.outs.push({ fmt, name, blob, url, script: S.script, muted: !!S.mute });
  const box = $('out'); box.innerHTML = '';
  const order = ['x', 'youtube', 'pc'];
  S.outs.sort((a, b) => order.indexOf(a.fmt) - order.indexOf(b.fmt)).forEach(o => {
    const a = document.createElement('a'); a.className = 'btn'; a.href = o.url; a.download = o.name; a.textContent = `Save ${FORMATS[o.fmt]}`;
    box.appendChild(a);
    const file = new File([o.blob], o.name, { type: o.blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      const b = document.createElement('button'); b.textContent = `Share ${FORMATS[o.fmt]}`;
      b.onclick = () => navigator.share({ files: [file], title: 'Reply News' }).catch(() => {});
      box.appendChild(b);
    }
  });
  box.classList.add('show');
  return name;
}
async function exportMP4(formats) {
  if (!S.script || S.busy) return;
  formats = (formats && formats.length ? formats : [S.format]).filter(f => FORMATS[f]);
  stop();
  setBusy(true);
  /* Sound off: the MP4 has no music either. */
  let aac = null;
  if (!S.mute) { try { aac = parseM4A(S.music); } catch (e) { console.warn('m4a', e); } }
  try {
    const names = [];
    for (let i = 0; i < formats.length; i++) {
      const fmt = formats[i], show = E.prepare(S.script, PRESET[fmt], LOOK);
      const p0 = 0.3 + 0.68 * i / formats.length, p1 = 0.3 + 0.68 * (i + 1) / formats.length;
      let blob = await encodeShow(show, FORMATS[fmt], p0, p1, aac);
      if (!blob) blob = await recordRealtime(show);
      names.push(addOut(fmt, blob));
    }
    progress(1);
    say(`Exported: ${names.join(', ')}`);
    return names;
  } finally {
    S.show = E.prepare(S.script, preset(), LOOK);
    sizeCanvas();
    draw(0);
    $('seek').value = '0';
    setBusy(false);
  }
}

/* Download: the video on screen as an MP4 in the current layout.
   Phones open the share sheet (Save Video); computers download the file. */
const PHONE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const INAPP = /; wv\)|\bLine\/|Twitter|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent);
function shareable(out) {
  if (!PHONE || !navigator.canShare) return null;
  const file = new File([out.blob], out.name, { type: out.blob.type });
  try { return navigator.canShare({ files: [file] }) ? file : null; } catch (e) { return null; }
}
function resetDownload() {
  const b = $('dl');
  if (!b) return;
  b.textContent = S.ready ? 'Save' : 'Download';
  if (S.ready) b.dataset.ready = '1'; else delete b.dataset.ready;
  b.disabled = !S.ready && (!S.show || !!S.busy);
}
/* In the Android app the MP4 goes to the phone's Movies folder through the app (window.AndroidApp). */
async function saveToApp(out) {
  const app = window.AndroidApp;
  try {
    say('Saving…');
    const bytes = new Uint8Array(await out.blob.arrayBuffer());
    if (!app.saveStart(out.name, out.blob.type || 'video/mp4')) throw new Error('Could not save the video.');
    const CH = 384 * 1024;
    for (let i = 0; i < bytes.length; i += CH) {
      const part = bytes.subarray(i, i + CH);
      let bin = '';
      for (let j = 0; j < part.length; j += 0x8000) bin += String.fromCharCode.apply(null, part.subarray(j, j + 0x8000));
      if (!app.saveChunk(btoa(bin))) throw new Error('Could not save the video.');
      if (i % (CH * 8) === 0) await sleep(0);
    }
    const where = app.saveEnd();
    if (!where) throw new Error('Could not save the video.');
    say(`Saved to ${where}`);
  } catch (e) {
    console.error(e);
    say(e.message || String(e), true);
  }
  resetDownload();
}
/* How a phone keeps the file:

async function download() {

  if (S.ready) { saveOut(S.ready); return; }
  if (S.busy || !S.script) return;
  const fmt = S.format;
  const mine = () => S.outs.find(o => o.fmt === fmt && o.script === S.script && o.muted === !!S.mute);
  if (mine()) { saveOut(mine()); return; }
  const was = S.playing;
  const b = $('dl');
  b.textContent = 'Making MP4…';
  try { await exportMP4([fmt]); }
  catch (e) { console.error(e); resetDownload(); say(e.message || String(e), true); return; }
  const out = mine();
  resetDownload();

    S.ready = out;

/* ---------- full screen ---------- */
function realFull() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function fullOn() { return !!(realFull() || S.pseudo || S.vfull); }
/* The browser's Fullscreen API, when it has one that works (PC, Android, iPad). */
function fsApi() {
  const node = $('watch');
  const req = node.requestFullscreen || node.webkitRequestFullscreen;
  const allowed = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  return req && allowed !== false ? req : null;
}
/* iPhone Safari and the X app have no Fullscreen API for a page, but a video can go full screen.
   The canvas is copied into a muted video behind it, and Full screen opens that video in the
   system player. The music keeps playing from the page. */
function setupVideoFull() {
  if (fsApi() || S.fv) return;
  const cv = $('cv');
  const v = document.createElement('video');
  if (typeof v.webkitEnterFullscreen !== 'function' || typeof cv.captureStream !== 'function') return;
  let stream = null;
  try { stream = cv.captureStream(30); } catch (e) { console.warn(e); return; }
  v.id = 'fsv';
  v.muted = true;
  v.defaultMuted = true;
  v.playsInline = true;
  v.setAttribute('muted', '');
  v.setAttribute('playsinline', '');
  v.setAttribute('webkit-playsinline', '');
  v.setAttribute('aria-hidden', 'true');
  v.srcObject = stream;
  cv.parentNode.insertBefore(v, cv);
  S.fv = v;
  const kick = () => { if (v.paused && !S.vfull) { const r = v.play(); if (r && r.catch) r.catch(() => {}); } };
  kick();
  /* Low Power Mode blocks the first start; any tap on the page tries again. */
  window.addEventListener('pointerdown', kick, true);
  v.addEventListener('webkitbeginfullscreen', () => { S.vfull = true; paintFull(); });
  v.addEventListener('webkitendfullscreen', () => { S.vfull = false; paintFull(); setTimeout(kick, 50); });
  /* Pause and play in the system player pause and play the video and the music. */
  v.addEventListener('pause', () => { setTimeout(() => { if (S.vfull && v.paused && S.playing) toggle(); }, 300); });
  v.addEventListener('play', () => { if (S.vfull && !S.playing) toggle(); });
}
function videoFull() {
  const v = S.fv;
  if (!v || v.readyState < 1 || typeof v.webkitEnterFullscreen !== 'function') return false;
  try {
    const r = v.play();
    if (r && r.catch) r.catch(() => {});
    v.webkitEnterFullscreen();
    return true;
  } catch (e) { console.warn(e); return false; }
}
/* S.pseudo is the page's own full screen, the last resort when neither works. */
function paintFull() {
  const on = fullOn();
  $('watch').classList.toggle('is-full', !!(realFull() || S.pseudo));
  $('watch').classList.toggle('pseudo', !!S.pseudo);
  document.body.classList.toggle('lock', !!S.pseudo);
  $('full').textContent = on ? 'Exit' : 'Full screen';
}
function waitFullChange(ms) {
  return new Promise(resolve => {
    const done = () => { document.removeEventListener('fullscreenchange', done); document.removeEventListener('webkitfullscreenchange', done); resolve(); };
    document.addEventListener('fullscreenchange', done);
    document.addEventListener('webkitfullscreenchange', done);
    setTimeout(done, ms);
  });
}
async function enterFull() {
  closeStudio();
  const node = $('watch');
  const req = fsApi();
  /* iPhone: the system player. This must run inside the tap, before any await. */
  if (!req && videoFull()) return;
  if (req) {
    try {
      const r = req.call(node);
      if (r && r.then) await r; else await waitFullChange(700);
    } catch (e) { console.warn(e); }
    if (realFull()) {
      paintFull();
      try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock(S.format === 'pc' ? 'landscape' : 'portrait'); } catch (e) {}
      return;
    }
  }
  S.pseudo = true;
  paintFull();
}
async function exitFull() {
  if (S.pseudo) { S.pseudo = false; paintFull(); return; }
  if (S.vfull && S.fv) {
    try { S.fv.webkitExitFullscreen(); } catch (e) { console.warn(e); }
    return;
  }
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (exit && realFull()) {
    try { const r = exit.call(document); if (r && r.then) await r; } catch (e) { console.warn(e); }
  }
  paintFull();
}
function toggleFull() { return fullOn() ? exitFull() : enterFull(); }

/* ---------- pull down to refresh ---------- */
function initPull() {
  /* Touch uses touch events, which keep coming while the browser scrolls; a mouse uses pointer events.
     A pull that is cancelled or lifted ends without a refresh, so it never stays half-open over the buttons. */
  const PULL_AT = 70;
  const frame = document.querySelector('.frame');
  let pull = null;
  const show = dy => {
    const label = document.querySelector('header .pull');
    if (label) label.textContent = dy > PULL_AT ? 'Release to refresh' : 'Pull down to refresh';
    if (dy > 0) { frame.classList.add('pulling'); frame.style.transform = 'translateY(' + Math.min(dy * 0.35, 72) + 'px)'; }
    else { frame.classList.remove('pulling'); frame.style.transform = ''; }
  };
  const end = go => {
    const p = pull;
    pull = null;
    if (p && p.dy > 8) S.pulledAt = Date.now();
    show(0);
    if (go && p && !p.dead && p.dy > PULL_AT) refreshMarket();
  };
  const begin = (target, y, kind) => {
    if (pull) end(false);
    if (S.vfull || studioOpen() || (!fullOn() && window.scrollY > 8)) return;
    if (target && target.closest && target.closest('button, a, input, select, textarea, .ctl, .music')) return;
    pull = { y, kind, dy: 0, dead: false };
  };
  const move = y => {
    if (!pull || pull.dead) return false;
    pull.dy = y - pull.y;
    if (pull.dy < -12) { pull.dead = true; show(0); return false; }
    show(pull.dy);
    return pull.dy > 8;
  };
  window.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { if (pull) end(false); return; }
    begin(e.target, e.touches[0].clientY, 'touch');
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!pull || pull.kind !== 'touch' || e.touches.length !== 1) return;
    if (move(e.touches[0].clientY) && e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', () => { if (pull && pull.kind === 'touch') end(true); });
  window.addEventListener('touchcancel', () => { if (pull && pull.kind === 'touch') end(false); });
  window.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button === 0) begin(e.target, e.clientY, 'mouse'); });
  window.addEventListener('pointermove', e => {
    if (!pull || pull.kind !== 'mouse' || e.pointerType !== 'mouse') return;
    if (!(e.buttons & 1)) { end(false); return; }
    move(e.clientY);
  });
  window.addEventListener('pointerup', e => { if (pull && pull.kind === 'mouse' && e.pointerType === 'mouse') end(true); });
  window.addEventListener('pointercancel', e => { if (pull && pull.kind === 'mouse' && e.pointerType === 'mouse') end(false); });
  window.addEventListener('blur', () => { if (pull) end(false); });
}

/* A newer copy on the site: load it, so a copy the browser kept from before is not shown.
   version.json names the latest build of each page; it is read past the browser's cache. */
function watchVersion(key, url) {
  const BUILD = '__BUILD_ID__';
  if (location.protocol === 'file:' || BUILD.indexOf('BUILD_ID') >= 0) return;
  /* At the start it may reload at once; later it waits while a video is being made or saved. */
  const check = first => {
    if (!first && S.busy) { setTimeout(() => check(false), 5000); return; }
    fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).then(v => {
      const now = v && v[key];
      if (!now || now === BUILD) return;
      if (!first && S.busy) { setTimeout(() => check(false), 5000); return; }
      try {
        if (sessionStorage.getItem('reloaded.' + key) === now) return;
        sessionStorage.setItem('reloaded.' + key, now);
      } catch (e) {}
      const u = new URL(location.href);
      u.searchParams.set('v', now);
      location.replace(u.href);
    }).catch(() => {});
  };
  check(true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(false); });
}

watchVersion('reply', 'version.json');
/* Japanese for the page's own words when Language is Japanese. */
if (window.UIJA) {
  UIJA.start(() => $('lang').value);
  ['lang', 'country'].forEach(id => $(id).addEventListener('change', () => UIJA.apply()));
}
loadAssets().then(() => {
  window.NS.ready = true;
  const requested = Q.get('music') || store.get('music', 'jupiter');
  if (requested !== 'jupiter') useTrack(requested);
  else document.querySelectorAll('#music button').forEach(b => b.classList.toggle('on', b.dataset.m === 'jupiter'));
  runAll({ export: false });
}).catch(e => { window.NS.ready = true; say(e.message || String(e), true); });
})();
</script>
</body>
</html>
